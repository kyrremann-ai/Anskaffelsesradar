# Hetzner VPS: docker compose up -d --build
# Caddy gir HTTPS (Let's Encrypt) og innlogging med passord foran appen.
services:
  app:
    build: .
    env_file: .env
    volumes:
      - radar-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  radar-data:
  caddy-data:
