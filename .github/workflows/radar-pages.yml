# Nattlig oppdatering av radar.vikingsea.no: henter TED/Doffin/Brreg, scorer, bygger og publiserer til Cloudflare Pages.
# Publiserer til hver kunde i deploy/kunder.json, tar sikkerhetskopi av sakene og prøver å gjenopprette den.
# Jobben blir rød (og GitHub sender e-post) når en kilde feiler, data er gamle, eller backup/gjenoppretting feiler.
# Hemmeligheter: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DOFFIN_API_KEY (valgfri),
#   BACKUP_PASSPHRASE (krypterer sikkerhetskopien som lagres i GitHub, utenfor Cloudflare).
name: Radar på Cloudflare
on:
  schedule:
    - cron: "0 3 * * *"   # 04:00 norsk vintertid
  workflow_dispatch:
    inputs:
      demo:
        description: "Bruk demodata (rask test)"
        type: boolean
        default: false
concurrency: { group: radar-pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RADAR_MODE: ${{ inputs.demo && 'demo' || 'live' }}
      RADAR_DEMO: ${{ inputs.demo && '1' || '' }}
      DOFFIN_API_KEY: ${{ secrets.DOFFIN_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      # Cache for TED/Brreg-svar og databasen, så bare nye kunngjøringer hentes hver natt
      - uses: actions/cache@v4
        with:
          path: backend/data
          key: radar-data-${{ env.RADAR_MODE }}-${{ github.run_id }}
          restore-keys: radar-data-${{ env.RADAR_MODE }}-
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      # Bemanningsregisteret avviser ofte skyservere. Prøv API-et, ellers bruk øyeblikksbildet i repoet
      # (deploy/snapshots/bemanning.json.gz, lagret fra nettleser). Bytt det ut når registeret endrer seg.
      - name: Hent bemanningsregisteret
        if: ${{ !inputs.demo }}
        run: |
          mkdir -p backend/data/import
          if curl -sf --max-time 180 -H "Accept: application/json" -o /tmp/bemanning.json \
               https://data.arbeidstilsynet.no/bemanningsforetaksregisteret2/api/virksomheter; then
            mv /tmp/bemanning.json backend/data/import/bemanning.json
          else
            echo "::warning::Bemanningsregisteret svarte ikke, bruker øyeblikksbildet i repoet"
            gunzip -c deploy/snapshots/bemanning.json.gz > backend/data/import/bemanning.json
          fi
          ls -la backend/data/import/bemanning.json
      # AI-vurderinger for saker med høy prioritet, laget av nattjobben på claude.ai før dette bygget
      # (radar.ai_vurderinger, lagret på grenen ai-vurderinger). Uten dem viser siden bare en forklaring.
      - name: Hent AI-vurderinger
        run: |
          mkdir -p backend/data/import
          if git fetch -q --depth=1 origin ai-vurderinger; then
            git show FETCH_HEAD:ai_vurderinger.json > backend/data/import/ai_vurderinger.json
          else
            echo "::warning::Fant ikke grenen ai-vurderinger"
          fi
      - run: deploy/build_pages.sh pages-out
      - name: Publiser, sikkerhetskopi og gjenopprettingstest
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN mangler, hopper over publisering"; exit 0; fi
          mkdir -p backup
          fail=0
          for k in $(python -c "import json;print(' '.join(k for k in json.load(open('deploy/kunder.json')) if not k.startswith('_')))"); do
            echo "::group::$k"
            RADAR_KUNDE=$k python deploy/cf_radar.py deploy pages-out || { echo "::error::Publisering feilet for $k"; fail=1; }
            if RADAR_KUNDE=$k python deploy/cf_radar.py backup backup; then
              RADAR_KUNDE=$k python deploy/cf_radar.py restore-test backup || { echo "::error::Gjenoppretting feilet for $k"; fail=1; }
            else
              echo "::error::Sikkerhetskopi feilet for $k"; fail=1
            fi
            echo "::endgroup::"
          done
          # Kopien inneholder notater og navn, så den lagres bare kryptert
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE mangler, så sikkerhetskopien lagres ikke utenfor Cloudflare"; fail=1
          else
            for f in backup/*.sql; do
              gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "$f.gpg" "$f"
            done
          fi
          rm -f backup/*.sql
          exit $fail
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.demo && hashFiles('backup/*.gpg') != '' }}
        with:
          name: saker-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
      # Varsling: kilder som feilet, gamle data eller ingen nye kunngjøringer gjør jobben rød
      - name: Sjekk kilder og alder på data
        if: ${{ always() && !inputs.demo }}
        working-directory: backend
        run: python -m radar.check
