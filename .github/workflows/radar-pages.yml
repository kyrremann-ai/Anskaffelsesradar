# Nattlig oppdatering av radar.vikingsea.no: henter TED/Doffin/Brreg, scorer, bygger og publiserer til Cloudflare Pages.
# Hemmeligheter: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DOFFIN_API_KEY (valgfri).
name: Radar på Cloudflare
on:
  schedule:
    - cron: "0 3 * * *"   # 04:00 norsk vintertid
  workflow_dispatch:
    inputs:
      demo:
        description: "Bruk demodata (rask test)"
        type: boolean
        default: false
concurrency: { group: radar-pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RADAR_MODE: ${{ inputs.demo && 'demo' || 'live' }}
      RADAR_DEMO: ${{ inputs.demo && '1' || '' }}
      DOFFIN_API_KEY: ${{ secrets.DOFFIN_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      # Cache for TED/Brreg-svar og databasen, så bare nye kunngjøringer hentes hver natt
      - uses: actions/cache@v4
        with:
          path: backend/data
          key: radar-data-${{ env.RADAR_MODE }}-${{ github.run_id }}
          restore-keys: radar-data-${{ env.RADAR_MODE }}-
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      # Bemanningsregisteret avviser skyservere i Claude-miljøet; prøv herfra og legg det som importfil hvis det går
      - name: Hent bemanningsregisteret
        if: ${{ !inputs.demo }}
        continue-on-error: true
        run: |
          mkdir -p backend/data/import
          curl -sf --max-time 180 -H "Accept: application/json" -o /tmp/bemanning.json \
            https://data.arbeidstilsynet.no/bemanningsforetaksregisteret2/api/virksomheter \
            && mv /tmp/bemanning.json backend/data/import/bemanning.json && ls -la backend/data/import/bemanning.json \
            || echo "::warning::Bemanningsregisteret svarte ikke (bruker forrige fil hvis den finnes)"
      - run: deploy/build_pages.sh pages-out
      - name: Publiser
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN mangler, hopper over publisering"; exit 0; fi
          python deploy/cf_radar.py deploy pages-out
