# Tilgangsstyring for radar.vikingsea.no uten å kjøre noe lokalt. Kjør fra Actions-fanen.
name: Radar-tilgang
on:
  workflow_dispatch:
    inputs:
      kommando:
        type: choice
        options: [grant, revoke, list, who, setup, migrer-eu, kunder]
        default: grant
      epost:
        description: "E-post (for grant/revoke)"
        required: false
      kunde:
        description: "Kunde fra deploy/kunder.json"
        default: demo
jobs:
  access:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EPOST: ${{ inputs.epost }}
      RADAR_KUNDE: ${{ inputs.kunde }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4   # wrangler, for migrer-eu
        with: { node-version: "22" }
      - run: python deploy/cf_radar.py "${{ inputs.kommando }}" $EPOST
